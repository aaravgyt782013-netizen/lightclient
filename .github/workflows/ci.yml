name: Ar Client CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  upstream-android-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu images already include the Android SDK.
      # Avoid setup-android's deprecated "tools" package install, which fails
      # because that package no longer exists in current SDK repositories.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build Ar Client Android launcher fork
        working-directory: android-launcher/upstream-pojav
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ar-client-android-debug
          path: android-launcher/upstream-pojav/app_pojavlauncher/build/outputs/apk/debug/*.apk

  fabric-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build Fabric mod
        run: gradle -p client-mod build
