name: Ar Client CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  upstream-android-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner has Android SDK files, but sdkmanager may not be on PATH.
      # Discover the installed command-line-tools version instead of assuming
      # a fixed version or installing the removed legacy "tools" package.
      - name: Locate Android SDK manager
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Found sdkmanager at $SDKMANAGER"
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build Ar Client Android launcher fork
        working-directory: android-launcher/upstream-pojav
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ar-client-android-debug
          path: android-launcher/upstream-pojav/app_pojavlauncher/build/outputs/apk/debug/*.apk

  fabric-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build Fabric mod
        run: gradle -p client-mod build
