name: Ar Client CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble Android shell
        run: gradle -p android-launcher :app:assembleDebug

  fabric-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build Fabric mod
        run: gradle -p client-mod build
